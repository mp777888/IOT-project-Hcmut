version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${SERVER_PORT:8080}:8080"
    environment:
      # Profile
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:prod}
      # MongoDB
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DATABASE=${MONGODB_DATABASE:db1}
      # Redis
      - REDIS_URL=${REDIS_URL}
      # Google OAuth2
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      # Adafruit IO
      - ADAFRUIT_USERNAME=${ADAFRUIT_USERNAME}
      - ADAFRUIT_KEY=${ADAFRUIT_KEY}
      # JWT
      - JWT_SIGNER_KEY=${JWT_SIGNER_KEY}
      # Notification Email (optional, if needed)
      - NOTIFICATION_EMAIL=${NOTIFICATION_EMAIL:anhkhoabuivu@gmail.com}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always

volumes:
  redis-data: