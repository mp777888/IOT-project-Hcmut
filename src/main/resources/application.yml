server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: iot-project
#  profiles:
#    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: ${MONGODB_DATABASE}
    redis:
      url: ${REDIS_URL}
      ssl:
        enabled: true
      timeout: 5000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
              - openid

app:
  notification:
    email: ${NOTIFICATION_EMAIL:anhkhoabuivu@gmail.com}

jwt:
  signerKey: ${JWT_SIGNER_KEY:cu+ODg482KxZvCd26KS9JRGbJZjtvGWrF+ZGlgqjIPTf5YImGQ9r/VDAjQUsTbgN}
  valid-duration: 3600
  refresh-duration: 604800

adafruit:
  io:
    username: ${ADAFRUIT_USERNAME}
    key: ${ADAFRUIT_KEY}
    mqtt:
      host: ${ADAFRUIT_MQTT_HOST:tcp://io.adafruit.com:1883}
      clientId: ${ADAFRUIT_CLIENT_ID:iot-backend-client-spring}
    list_feeds: ${ADAFRUIT_LIST_FEEDS:output-ledrgb,output-water-pumps,output-relay,input-temperature,input-humidity,input-soil-moisture,input-light}
    feeds:
      led: ${ADAFRUIT_FEED_LED:output-ledrgb}
      waterPump: ${ADAFRUIT_FEED_WATER_PUMP:output-water-pumps}
      relay: ${ADAFRUIT_FEED_RELAY:output-relay}
      temperature: ${ADAFRUIT_FEED_TEMPERATURE:input-temperature}
      humidity: ${ADAFRUIT_FEED_HUMIDITY:input-humidity}
      soilMoisture: ${ADAFRUIT_FEED_SOIL_MOISTURE:input-soil-moisture}
      light: ${ADAFRUIT_FEED_LIGHT:input-light}